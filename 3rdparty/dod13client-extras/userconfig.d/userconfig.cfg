cl_lw 1
cl_lc 1
cl_nopred 0

// The tilt of the view when strafing is set by the server. 2 is the value of GoldSrc, Xash3D has 0.
// It matters for a server that is started from this game; a dedicated server has its own config.
sv_rollangle 2
sv_rollspeed 200

// The sway of the weapon. Half-Life leaves 0.01 in config.cfg, twice as much as the value of Day of Defeat.
cl_bob 0.005

// The lines of the console are not shown over the game: a line is drawn while it is younger than this time, -1 is never.
con_notifytime -1
