// The settings that the client of Day of Defeat depends on.
// The engine executes userconfig.d/*.cfg after config.cfg on every start, so these values win over the ones saved
// in config.cfg and the player cannot break them by accident. Change them only if you know what they do.

// Weapons are predicted by the client (cl_lw) and the server compensates the lag of the shots (cl_lc).
// With cl_lw 0 the weapons do not work as they should, the client sets it back to 1 by itself.
cl_lw 1
cl_lc 1

// Prediction of the movement, 0 means it is on.
cl_nopred 0

// The tilt of the view when strafing is set by the server. 2 is the value of GoldSrc, Xash3D has 0.
// It matters for a server that is started from this game; a dedicated server has its own config.
sv_rollangle 2
sv_rollspeed 200
