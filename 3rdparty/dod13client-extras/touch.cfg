touch_config_file "touch.cfg"

// touch cvars

// sensitivity settings
touch_pitch "90"
touch_yaw "120"
touch_forwardzone "0.06"
touch_sidezone "0.06"
touch_nonlinear_look "0"
touch_pow_factor "1.3"
touch_pow_mult "400"
touch_exp_mult "0"

// grid settings
touch_grid_count "50"
touch_grid_enable "1"

// global overstroke (width, r, g, b, a)
touch_set_stroke 1 255 255 255 255

// highlight when pressed
touch_highlight_r "1"
touch_highlight_g "1"
touch_highlight_b "1"
touch_highlight_a "1"

// _joy and _dpad options
touch_dpad_radius "1"
touch_joy_radius "1"

// how much slowdown when Precise Look button pressed
touch_precise_amount "0.5"

// enable/disable move indicator
touch_move_indicator "0"

// reset menu state when execing config
touch_setclientonly 0

// touch buttons
touch_removeall
touch_addbutton "look" "" "_look" 0.5 0 1 1 255 255 255 255 0
touch_addbutton "move" "" "_move" 0 0 0.5 1 255 255 255 255 0
touch_addbutton "invnext" "touch_default/next_weap" "invnext" 0 0.5302 0.12 0.743533 255 255 255 255 0
touch_addbutton "invprev" "touch_default/prev_weap" "invprev" 0 0.075743 0.12 0.289076 255 255 255 255 0
touch_addbutton "use" "touch_default/use" "+use" 0.88 0.454457 1 0.66779 255 255 255 255 0
touch_addbutton "jump" "touch_default/jump" "+jump" 0.88 0.227228 1 0.440561 255 255 255 255 0
touch_addbutton "attack" "touch_default/shoot" "+attack" 0.76 0.5302 0.88 0.743533 255 255 255 255 0
touch_addbutton "attack2" "touch_default/shoot_alt" "+attack2" 0.76 0.302971 0.88 0.516304 255 255 255 255 0
touch_addbutton "loadquick" "touch_default/load" "loadquick" 0.76 0 0.84 0.142222 255 255 255 255 16
touch_addbutton "savequick" "touch_default/save" "savequick" 0.84 0 0.92 0.142222 255 255 255 255 16
touch_addbutton "messagemode" "touch_default/keyboard" "messagemode" 0.84 0 0.92 0.142222 255 255 255 255 8
touch_addbutton "reload" "touch_default/reload" "+reload" 0 0.302971 0.12 0.516304 255 255 255 255 0
touch_addbutton "flashlight" "touch_default/flash_light_filled" "impulse 100" 0.92 0 1 0.142222 255 255 255 255 0
touch_addbutton "scores" "touch_default/map" "+showscores" 0.76 0 0.84 0.142222 255 255 255 255 8
touch_addbutton "show_numbers" "touch_default/show_weapons" "exec touch_default/numbers.cfg" 0.44 0.833171 0.52 0.975393 255 255 255 255 0
touch_addbutton "duck" "touch_default/crouch" "+duck" 0.88 0.757428 1 0.970761 255 255 255 255 0
touch_addbutton "tduck" "touch_default/tduck" ";+duck" 0.56 0.833171 0.62 0.939838 255 255 255 255 0
touch_addbutton "edit" "touch_default/settings" "touch_enableedit" 0.42 0 0.5 0.142222 255 255 255 255 32
touch_addbutton "menu" "touch_default/menu" "cancelselect" 0 0.833171 0.08 0.975393 255 255 255 255 0
touch_addbutton "spray" "touch_default/spray" "impulse 201" 0.68 0 0.76 0.142222 255 255 255 255 8
touch_addbutton "voicechat" "touch_default/microphone" "+voicerecord" 0.78 0.817778 0.86 0.96 255 255 255 255 8

// the touch controls of Day of Defeat replace the buttons above
exec "touch_presets/touch_whamer.cfg"

// the preset makes touch_profiles/touch_whamer.cfg the current profile, keep touch.cfg: the changes of the player are saved to it
touch_config_file "touch.cfg"
